spring:
  application:
    name: trokr

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:trokr_db}
    username: ${DB_USER:trokr_user}
    password: ${DB_PASSWORD:changeme_local_dev}

  jpa:
    hibernate:
      # ddl-auto=update é uma simplificação temporária para o início do curso:
      # o Hibernate cria/ajusta as tabelas sozinho a partir das entidades.
      # Isso será substituído por migrations versionadas (Flyway/Liquibase)
      # em uma aula futura, quando controle de schema passar a importar.
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  mongodb:
    host: ${MONGO_HOST:mongo}
    port: ${MONGO_PORT:27017}
    database: trokr
    username: trokr
    password: changeme_local_dev
    authentication-database: admin

management:
  endpoints:
    web:
      exposure:
        # Expor só o necessário nesta fase: health (usado como /health do
        # enunciado) e info. Nada de segurança/autenticação em cima disso ainda.
        include: health,info

trokr:
  demo:
    atraso-ms: ${TROKR_DEMO_ENDPOINTS:true}
  notificacao:
    taxa-falha: 0.3
    latencia-ms: 150
    espera-inicial-retentativa-ms: 200
    max-tentativas: 3
    tempo-aberto-disjuntor: 30s
    limite-falhas: 5

springdoc:
  api-docs:
    path: /v3/api-docs # a especificação em JSON
  swagger-ui:
    path: /swagger-ui.html # a tela
    tags-sorter: alpha # grupos em ordem alfabética
    operations-sorter: method # dentro do grupo, por método HTTP
    try-it-out-enabled: true # já abre com o "Try it out" ativo
    display-request-duration: true # tempo de cada requisição
